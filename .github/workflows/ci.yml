name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfcheck:
    name: Selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Selfcheck
        run: npm run selfcheck
        env:
          QEVA_EDITION: community

  secret-scan-sanity:
    name: Secret path sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be tracked"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::Tracked env file that is not .env.example"
            git ls-files | grep -E '(^|/)\.env'
            exit 1
          fi
          echo "OK: no tracked .env secrets"
