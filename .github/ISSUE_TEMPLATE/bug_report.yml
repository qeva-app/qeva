name: Bug report
description: Something broken in Community Qeva
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues → see [SECURITY.md](../../SECURITY.md). Do not describe exploitable vulns in public issues.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running Qeva?
      options:
        - Docker Compose (bundled Postgres)
        - Docker Compose (external Postgres / Supabase)
        - Local npm run dev
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / image tag
      placeholder: e.g. main @ abc1234 or qeva-qeva:latest
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redact secrets)
      render: shell
