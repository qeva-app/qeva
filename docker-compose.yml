# Community Edition - Qeva + PostgreSQL (bundled) or external Postgres/Supabase.
#
# Bundled DB:
#   docker compose --profile bundled up -d --build
#
# External DB (set DATABASE_URL in .env to Postgres/Supabase):
#   docker compose up -d --build
#
# First boot prints QEVA_BOOTSTRAP_PASSWORD once when SUPER_ADMIN_EMAIL is set:
#   docker compose logs qeva | grep QEVA_BOOTSTRAP_PASSWORD

services:
  qeva:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
    container_name: qeva-app
    restart: unless-stopped
    ports:
      - "${QEVA_PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      # Locked production - do not take NODE_ENV from .env (would enable Next dev behavior).
      NODE_ENV: production
      # Use QEVA_DATABASE_URL for external/Supabase. Do not use host DATABASE_URL
      # (Windows/shell often points at localhost and breaks the container).
      DATABASE_URL: ${QEVA_DATABASE_URL:-postgresql://qeva:${DB_PASSWORD}@postgres:5432/qeva?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      QEVA_EDITION: ${QEVA_EDITION:-community}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:-${NEXTAUTH_SECRET}}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-3600}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@qeva.local}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - qeva-logs:/app/logs
      - qeva-certs:/app/certs
    networks:
      - qeva-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    profiles: ["bundled"]
    image: postgres:16-alpine
    container_name: qeva-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qeva
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: qeva
    # DB port is internal-only by default. Uncomment to debug from the host:
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - qeva-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qeva -d qeva"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  qeva-logs:
  qeva-certs:

networks:
  qeva-network:
    driver: bridge
